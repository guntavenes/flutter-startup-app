name: ceyizim_plus
description: "Çeyizim+ - Çeyiz planlama, harcama takibi ve ortak liste uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.1

  # Database
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0

  # Media
  image_picker: ^1.2.1
  media_store_plus: ^0.1.3

  # Charts
  fl_chart: ^1.0.0

  # Notifications
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  workmanager: ^0.9.0+3

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  excel: ^4.0.6
  file_saver: ^0.2.14
  firebase_app_check: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  drift_dev: ^2.32.1

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/branding/app_icon.png

  remove_alpha_ios: true

  adaptive_icon_background: "#FFF5FA"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter_native_splash:
  color: "#FFF5FA"
  image: assets/branding/splash_logo_1.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFF5FA"
    image: assets/branding/splash_logo_1.png